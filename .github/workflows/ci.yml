name: CI

# Two jobs: `build` on every push and PR, `release` on a version tag. No JitPack job — nothing resolves
# this module as a dependency; the GitHub Release's jar is the artifact.
#
# No upstream is built from source: this module depends on nothing of ours. Tests spawn no process —
# what they hold is the three text formats read (tmux, cswap, ip) and the two guards (token, activity).

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test
        run: mvn -B verify

      # The shaded jar has to start: a shade configuration that loses the manifest transformer builds,
      # publishes, and answers `no main manifest attribute` to the first person who downloads it. With no
      # tailscale0 on the runner and no --bind the server refuses to start — exit 1 with the sentence — and
      # that refusal is the assertion.
      - name: The executable jar starts and refuses to bind the world
        run: |
          set +e
          out=$(java -jar target/botmaker-remote-server-0.0.0-SNAPSHOT-all.jar 2>&1)
          code=$?
          set -e
          echo "$out"
          [ "$code" = "1" ] && echo "$out" | grep -q "binds the tailnet or nothing"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Shade names the jar from the pom's cosmetic 0.0.0-SNAPSHOT whatever the tag says; rename it once,
      # here, to the name jreleaser.yml and tools/install.sh both use. The tag reaches the manifest through
      # -Dbotmaker.remote.version so `/api/status` reports the release rather than "dev".
      - name: Build the executable jar
        run: |
          mvn -B package -DskipTests "-Dbotmaker.remote.version=${GITHUB_REF_NAME#v}"
          shaded=target/botmaker-remote-server-0.0.0-SNAPSHOT-all.jar
          if [ ! -f "$shaded" ]; then
            echo "::error::$shaded was not produced — maven-shade-plugin attached nothing." >&2
            ls -la target >&2
            exit 1
          fi
          mv "$shaded" target/botmaker-remote-server-all.jar

      # rpm + deb from ONE description, with a single Go binary rather than rpmbuild (absent from
      # ubuntu-latest), fakeroot, a .spec and a debian/ directory. See packaging/nfpm.yaml for why not
      # jpackage. The names are unversioned, like the jar's, because the README links
      # releases/latest/download/<name>.
      #
      # The rpm is signed when the secrets are present and unsigned otherwise — dnf refuses an unsigned
      # package under gpgcheck=1, and a fork's tag build has no key. Same handling as botmaker-cli's.
      - name: Build the rpm and the deb
        env:
          NFPM_VERSION: '2.43.0'
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          NFPM_RPM_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          curl -fsSL -o /tmp/nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          tar -xzf /tmp/nfpm.tar.gz -C /tmp nfpm
          # The tag, not the pom: this pom's <version> is the cosmetic 0.0.0-SNAPSHOT.
          export BOTMAKER_VERSION="${GITHUB_REF_NAME#v}"
          export NFPM_RPM_KEY_FILE=""
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            NFPM_RPM_KEY_FILE="${RUNNER_TEMP}/botmaker-signing.asc"
            printf '%s' "$GPG_PRIVATE_KEY" | base64 -d > "$NFPM_RPM_KEY_FILE"
            export NFPM_RPM_KEY_FILE
          else
            echo "::warning::GPG_PRIVATE_KEY is unset — building an rpm that dnf will refuse under gpgcheck=1."
          fi
          /tmp/nfpm package -f packaging/nfpm.yaml -p rpm -t target/botmaker-remote-server.rpm
          /tmp/nfpm package -f packaging/nfpm.yaml -p deb -t target/botmaker-remote-server.deb
          rm -f "${RUNNER_TEMP}/botmaker-signing.asc"
          ls -la target/botmaker-remote-server.rpm target/botmaker-remote-server.deb

      # The packages are what the dnf/apt repositories are built from, on a different runner.
      - name: Upload the packages
        uses: actions/upload-artifact@v7
        with:
          name: linux-packages
          path: |
            target/botmaker-remote-server.rpm
            target/botmaker-remote-server.deb
          if-no-files-found: error

      # The SAME script the umbrella's release gate reads (ChangelogGate): one extractor, two readers.
      - name: Extract the changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p target
          tools/changelog-section.sh "$version" > target/jreleaser-changelog.md
          echo "JRELEASER_PROJECT_VERSION=$version" >> "$GITHUB_ENV"

      - name: Publish the release
        uses: jreleaser/release-action@v2
        with:
          version: 1.25.0
          arguments: full-release
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The dnf/apt repositories on GitHub Pages, so `sudo dnf install botmaker-remote-server` works and later
  # versions arrive with the system's updates. botmaker-cli's job, with the names changed.
  pages:
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    # Job-level permissions replace the workflow's. deploy-pages needs id-token for its OIDC handshake.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Pages allows one deployment at a time; queue rather than cancel, so a release never ends up with the
    # previous tag left live because its own deploy was cancelled by a newer one.
    concurrency:
      group: pages
      cancel-in-progress: false
    env:
      GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
    steps:
      # Only for .github/scripts/build-repo.sh — nothing here is built from source.
      - uses: actions/checkout@v7

      - name: Download the packages
        uses: actions/download-artifact@v8
        with:
          name: linux-packages
          path: artifacts

      # createrepo_c writes the dnf metadata; apt-ftparchive (apt-utils) writes Packages/Release.
      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y createrepo-c apt-utils

      - name: Import signing key
        if: env.GPG_KEY_ID != ''
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --reload gpg-agent || true
          echo "$GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import
          echo "BOTMAKER_SIGN=1" >> "$GITHUB_ENV"

      - name: Build dnf + apt repositories
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: bash .github/scripts/build-repo.sh artifacts site "${GITHUB_REF_NAME}"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
